<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background: linear-gradient(#8e9eab,#464d3e);

        }
        .one

        {
            border: wheat 3px solid;
            height: 260px;
            width: 110px;
            margin-left: 100px;
            border-radius: 70px;
            background-color: black;

        }
        .two
        {
            border: wheat 3px solid;
            height: 50px;
            width: 50px;
            margin-left: 130px;
            margin-top: 30px;
            border-radius: 100px;
            margin-top: -230px;

        }
        .three
        {
            border: wheat 3px solid;
            height: 50px;
            width: 50px;
            margin-top: 20px;
            border-radius:  100px;
            margin-left: 130px;
            margin-bottom: 20px;
            


        }
        .four
        {
            border: wheat 3px solid;
            height: 50px;
            width: 50px;
            margin-bottom: 20px;
            border-radius: 100px;
            margin-left: 130px;
            
        }
        .one:hover{
            background-color: black;
        

        }
        .two:hover{
            background-color: red;
        }
        .three:hover{
            background-color: yellow;
        }
        .four:hover{
            background-color: green;
            
        }
       
        #a{
            border: white 3px solid;
            height: 300px;
            width: 10px;
            margin-left: 148px;
            border-radius: 0px;
            background-color: black;
        }
        #b{
            border: 2px white solid;
            height: 50px;
            width: 100px;
            margin-left: 105px;
            border-top-left-radius: 40px;
            border-top-right-radius: 40px;
            background-color: black;
        }

    </style>
</head>
<body>
    <div class="one"></div>
        <div class="two"></div>
        <div class="three"></div>
        <div class="four"></div>
    </div>
    <div id="a"></div>
    <div id="b"></div>
</body>
</html>
